name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Auditar dependencias de produccion
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Probar el paquete como lo instala un usuario
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/consumidor" && cd "$RUNNER_TEMP/consumidor"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/*.tgz
          NAME=$(node -p "require('$GITHUB_WORKSPACE/package.json').name")
          node -e "const m = require('$NAME'); if (!Object.keys(m).length) throw new Error('require vacio'); console.log('require ok')"
          node --input-type=module -e "const m = await import('$NAME'); if (!Object.keys(m).length) throw new Error('import vacio'); console.log('import ok')"
      - name: Revisar los tipos publicados
        if: matrix.node == 22
        run: npx --yes @arethetypeswrong/cli@0.18.5 --pack . --profile node16

  publish:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Ver si la version ya esta publicada
        id: version
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publicar en npm (trusted publishing con procedencia)
        if: steps.version.outputs.publish == 'true'
        run: npm publish --provenance --access public
      - name: Crear release en GitHub
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" --generate-notes --target "$GITHUB_SHA"
